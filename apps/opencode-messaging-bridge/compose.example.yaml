# Copy to compose.local.yaml, replace the placeholders, then run:
# docker compose -f compose.local.yaml up -d --build
# docker compose -f compose.local.yaml logs -f opencode-bridge

services:
  opencode-bridge:
    build:
      context: .
      args:
        OPENCODE_VERSION: "1.0.180"
    image: opencode-messaging-bridge:local
    container_name: opencode-bridge
    command: ["yarn", "start", "discord"] # telegram, discord, or telegram+discord
    init: true
    restart: unless-stopped
    environment:
      OPENCODE_BRIDGE_MANAGE_OPENCODE: "1"
      OPENCODE_BRIDGE_OPENCODE_HOST: "127.0.0.1"
      OPENCODE_BRIDGE_OPENCODE_PORT: "4096"
      OPENCODE_BRIDGE_OPENCODE_WORKDIR: "/workspace/project"
      OPENCODE_BRIDGE_IMPLICIT_REPLY: "0"
      XDG_STATE_HOME: "/state"

      OPENCODE_BRIDGE_DISCORD_BOT_TOKEN: "replace-with-real-token"
      OPENCODE_BRIDGE_DISCORD_CONTROL_CHANNEL_ID: "123456789012345678"
      OPENCODE_BRIDGE_DISCORD_ALLOWED_USER_IDS: "123456789012345678"
      OPENCODE_BRIDGE_DISCORD_APPLICATION_ID: "123456789012345678"
      OPENCODE_BRIDGE_DISCORD_GUILD_ID: "123456789012345678"
      OPENCODE_BRIDGE_DISCORD_REGISTER_SLASH_COMMANDS: "1"
      OPENCODE_BRIDGE_DISCORD_SLASH_COMMAND: "oc"
      OPENCODE_BRIDGE_DISCORD_PREFIX: "!oc"
      OPENCODE_BRIDGE_DISCORD_SLASH_EPHEMERAL: "1"
      OPENCODE_BRIDGE_DISCORD_MESSAGE_CONTENT_INTENT: "0"

      # Uncomment these when command is telegram or telegram+discord.
      # OPENCODE_BRIDGE_TELEGRAM_BOT_TOKEN: "123456789:replace-with-real-token"
      # OPENCODE_BRIDGE_TELEGRAM_ALLOWED_USER_IDS: "123456789"
      # OPENCODE_BRIDGE_TELEGRAM_ALLOWED_CHAT_IDS: "123456789"
    volumes:
      - "/home/kieran/.local/share/opencode:/home/node/.local/share/opencode"
      - "/home/kieran/.config/opencode-messaging-bridge/opencode-config:/home/node/.config/opencode:ro"
      - "/home/kieran/dev/bsociety:/workspace/project"
      - "opencode-bridge-state:/state"

volumes:
  opencode-bridge-state: {}
